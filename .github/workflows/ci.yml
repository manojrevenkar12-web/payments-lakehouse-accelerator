name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: pip install -e ".[dev]"
      - name: Unit + integration tests (local Spark + delta-rs)
        run: pytest -q
      - name: End-to-end smoke run and model quality gate
        env:
          PAYLAKE_LAKE_ROOT: ${{ runner.temp }}/lake
          PAYLAKE_LANDING_ROOT: ${{ runner.temp }}/landing
        run: |
          paylake generate --days 14 --customers 1500
          paylake run
          python - <<'EOF'
          import json, os, sys
          m = json.load(open(os.path.join(os.environ["PAYLAKE_LAKE_ROOT"], "reports", "model_report.json")))
          print(json.dumps({k: m[k] for k in ("pr_auc", "precision_at_budget", "recall_at_budget", "rules_recall", "model_recall_at_rules_volume")}, indent=2))
          # block merges that make the model worse than the incumbent rules at equal alert volume
          sys.exit(0 if m["model_recall_at_rules_volume"] > m["rules_recall"] and m["pr_auc"] > 0.6 else 1)
          EOF
          paylake eval-copilot --reference-only

  bundle:
    runs-on: ubuntu-latest
    needs: test
    # runs only when workspace credentials are configured as repository secrets
    env:
      DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
      DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - if: env.DATABRICKS_HOST != ''
        uses: databricks/setup-cli@main
      - if: env.DATABRICKS_HOST != ''
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - if: env.DATABRICKS_HOST != ''
        run: pip install build
      - if: env.DATABRICKS_HOST != ''
        run: databricks bundle validate -t dev
      - if: env.DATABRICKS_HOST != '' && github.ref == 'refs/heads/main'
        run: databricks bundle deploy -t dev
