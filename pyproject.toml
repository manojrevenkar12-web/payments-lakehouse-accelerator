[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "paylake"
version = "0.1.0"
description = "Payments Lakehouse Accelerator: ISO 20022 medallion pipeline, data quality, fraud/mule scoring and an analyst copilot on Databricks"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Manoj Kumar Prakash" }]
dependencies = [
  "pyspark>=4.0,<4.1",
  "pandas>=2.0",
  "pyarrow>=15",
  "scikit-learn>=1.4",
  "mlflow>=2.14",
  "sqlglot>=25",
  "pyyaml>=6",
  "httpx>=0.27",
]

[project.optional-dependencies]
local = ["deltalake>=1.0"]
app = ["fastapi>=0.110", "uvicorn>=0.29", "deltalake>=1.0"]
dev = ["pytest>=8", "deltalake>=1.0", "fastapi>=0.110", "httpx>=0.27", "lxml>=5"]

[project.scripts]
paylake = "paylake.cli:main"
paylake-bronze = "paylake.cli:bronze_entry"
paylake-silver = "paylake.cli:silver_entry"
paylake-gold = "paylake.cli:gold_entry"
paylake-train = "paylake.cli:train_entry"
paylake-score = "paylake.cli:score_entry"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
paylake = ["copilot/*.yaml", "app/static/*.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
